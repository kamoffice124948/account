<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin account generator</title>
<style>body{font-family:"Segoe UI",Arial,sans-serif;background:#f1f5f4;margin:0;padding:20px;color:#1e293b}.c{max-width:560px;margin:30px auto;background:#fff;border-radius:12px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.08)}h2{margin-top:0;color:#0f766e}label{display:block;margin:12px 0 4px;font-size:14px}input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;box-sizing:border-box}button{margin-top:16px;padding:10px 18px;border:0;border-radius:8px;background:#0f766e;color:#fff;font-size:15px;cursor:pointer}textarea{width:100%;height:80px;margin-top:12px;font-family:monospace;font-size:12px;box-sizing:border-box}.h{color:#64748b;font-size:13px}</style></head><body><div class="c">
<h2>Admin account generator</h2>
<p class="h">Type the admin username and a strong password. Copy the line below and paste it inside <b>config.js</b> (replace the old line, or add a new line for another admin). Nothing is sent anywhere – this runs only in your browser.</p>
<label>Username</label><input id="u" autocomplete="off"><label>Password (min 8 characters)</label><input id="p" type="text" autocomplete="off">
<button onclick="gen()">Generate line</button><textarea id="o" readonly></textarea><p class="h" id="m"></p></div>
<script>
async function gen(){const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value,m=document.getElementById('m');
if(!u||p.length<8){m.textContent='Enter a username and a password of at least 8 characters.';return}
const salt=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);
const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256);
const h=Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('');
document.getElementById('o').value='  { u: '+JSON.stringify(u)+', salt: "'+salt+'", h: "'+h+'" }';m.textContent='Copy this line into config.js inside the ADMINS list (use a comma between lines).'}
</script></body></html>
